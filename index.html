<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運動數據分析平台</title>
    <!-- 引入 Tailwind CSS 進行 RWD 響應式排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Plotly.js 繪圖庫 -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <!-- 引入 SheetJS (xlsx) 用於解析 Excel 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- 頂部導覽列：RWD 自適應排列 (手機垂直堆疊、平板以上橫向並排) -->
    <header class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row items-center justify-between gap-4">
            
            <!-- 標題 -->
            <div class="flex items-center space-x-3">
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-wide text-white">運動數據分析平台</h1>
                </div>
            </div>

            <!-- 檔案上傳與模式切換控制器 -->
            <div class="flex flex-wrap items-center justify-center sm:justify-end gap-3 w-full sm:w-auto">
                <!-- 上傳 Excel 按鈕 -->
                <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-lg transition-colors shadow-sm flex items-center gap-2">
                    <span>📁 選擇 Excel</span>
                    <input type="file" id="excelFile" class="hidden"> <!-- 移除 accept 限制 -->
                </label>

                <!-- 分析模式切換選單 -->
                <select id="modeSelector" class="bg-gray-800 text-gray-200 border border-gray-700 text-xs sm:text-sm rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="smmi">模式 1：SMMI 迴歸分析</option>
                    <option value="stats">模式 2：各項數據分析 (直方圖+常態曲線)</option>
                </select>

                <!-- 工作表切換選單 (動態顯示) -->
                <div id="sheetSelectorWrapper" class="hidden flex items-center gap-2">
                    <span class="text-xs text-gray-400">分頁:</span>
                    <select id="sheetSelector" class="bg-gray-800 text-gray-200 border border-gray-700 text-xs sm:text-sm rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </select>
                </div>
            </div>

        </div>
    </header>

    <!-- 主要內容顯示區域：RWD 彈性容器，支援多欄網格與獨立黑色卡片流暢向下延伸 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div id="chartsWrapper" class="space-y-6">
            <!-- 初始提示區塊 -->
            <div class="w-full h-[350px] bg-gray-900 rounded-2xl border border-gray-800 flex flex-col items-center justify-center text-center p-6 shadow-xl">
                <div class="text-4xl mb-3">📂</div>
                <h3 class="text-base sm:text-lg font-semibold text-gray-300">尚未上傳資料</h3>
                <p class="text-xs sm:text-sm text-gray-500 mt-1 max-w-md">請點擊上方「選擇 Excel」按鈕上傳數據檔案</p>
            </div>
        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="bg-gray-900 border-t border-gray-800 py-4 text-center text-xs text-gray-500">
        Sports Analytics Dashboard &copy; 2026 | Responsive Design Enabled
    </footer>

    <!-- 載入對應的 JS 控制器邏輯 -->
    <script src="smmi-ver.js"></script>
    <script src="average.js"></script>
    <script>
        // 全域初始化與檔案監聽主程式
        let globalWorkbook = null;

        document.getElementById('excelFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onerror = function(err) {
                console.error("FileReader 錯誤:", err);
                alert("手機讀取檔案失敗，可能原因：記憶體不足或瀏覽器權限受限。");
            };
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    globalWorkbook = XLSX.read(data, { type: 'array' });
                    
                    // 根據目前選定的模式觸發對應的分析函式
                    triggerActiveMode();
                } catch (err) {
                    console.error(err);
                    alert('讀取檔案發生錯誤，請確認是否為有效的 Excel 檔案。');
                }
            };
            reader.readAsArrayBuffer(file);
        });

        document.getElementById('modeSelector').addEventListener('change', function() {
            if (globalWorkbook) {
                triggerActiveMode();
            } else {
                const wrapper = document.getElementById('chartsWrapper');
                wrapper.innerHTML = `
                    <div class="w-full h-[350px] bg-gray-900 rounded-2xl border border-gray-800 flex flex-col items-center justify-center text-center p-6 shadow-xl">
                        <div class="text-4xl mb-3">📂</div>
                        <h3 class="text-base sm:text-lg font-semibold text-gray-300">尚未上傳資料</h3>
                        <p class="text-xs sm:text-sm text-gray-500 mt-1 max-w-md">請先上傳 Excel 檔案以啟用分析模式。</p>
                    </div>
                `;
            }
        });

        function triggerActiveMode() {
            const mode = document.getElementById('modeSelector').value;
            const sheetSelectorWrapper = document.getElementById('sheetSelectorWrapper');
            
            if (mode === 'smmi') {
                sheetSelectorWrapper.classList.add('hidden');
                runSmmiAnalysis(globalWorkbook);
            } else if (mode === 'stats') {
                runStatsAnalysis(globalWorkbook);
            }
        }
    </script>
</body>
</html>
