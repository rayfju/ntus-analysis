<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數據分析平台</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 SheetJS (解析 Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- 引入 Plotly.js -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6 md:p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">數據分析平台</h1>
        <p class="text-gray-600 mb-6">請先上傳您的 Excel 檔案，並透過下方選單切換分析。</p>

        <!-- 檔案上傳區塊 -->
        <div class="mb-4">
            <label class="block mb-2 text-sm font-medium text-gray-700">選擇 Excel 檔案 (.xlsx, .xls)</label>
            <input type="file" id="excelFile" accept=".xlsx, .xls" 
                class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md">
        </div>

        <!-- 下拉式選單：選擇分析模式 -->
        <div class="mb-4">
            <label class="block mb-2 text-sm font-medium text-gray-700">選擇分析模式</label>
            <select id="analysisMode" class="block w-full p-2.5 text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                <option value="smmi">SMMI 垂直跳分析</option>
                <option value="stats">各項數據分析 (平均數與標準差)</option>
                <option value="radar">國三生正五角形分析圖</option>
                <option value="g_strength">握力與SMMI分析圖</option>
            </select>
        </div>

        <!-- 下拉式選單：選擇工作表 (專供「各項數據分析」使用，平時隱藏) -->
        <div id="sheetSelectorWrapper" class="mb-6 hidden">
            <label class="block mb-2 text-sm font-medium text-gray-700">選擇要檢視的工作表 (Sheet)</label>
            <select id="sheetSelector" class="block w-full p-2.5 text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                <!-- 動態載入 -->
            </select>
        </div>

        <!-- 下拉式選單：選擇年級 (專供正五角形與握力SMMI模式使用，平時隱藏) -->
        <div id="gradeSelectorWrapper" class="mb-6 hidden">
            <label class="block mb-2 text-sm font-medium text-gray-700">選擇要檢視的年級</label>
            <select id="gradeSelector" class="block w-full p-2.5 text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                <!-- 動態載入 -->
            </select>
        </div>

        <!-- 下拉式選單：選擇學校 (專供正五角形與握力SMMI模式使用，平時隱藏) -->
        <div id="schoolSelectorWrapper" class="mb-6 hidden">
            <label class="block mb-2 text-sm font-medium text-gray-700">選擇要檢視的學校 (預設：全體學校)</label>
            <select id="schoolSelector" class="block w-full p-2.5 text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                <!-- 動態載入 -->
            </select>
        </div>

        <!-- 錯誤訊息提示 -->
        <div id="errorMessage" class="hidden mb-4 p-4 text-sm text-red-700 bg-red-100 rounded-md"></div>

        <!-- 內容顯示區域 -->
        <div id="chartsWrapper" class="space-y-6">
            <div class="w-full h-[300px] bg-gray-900 rounded-xl border border-gray-800 flex items-center justify-center text-gray-400">
                尚未上傳資料，請先選擇 Excel 檔案與分析模式
            </div>
        </div>
    </div>

    <!-- 引入對應的 JS 模組 -->
    <script src="SMMI-ver.js"></script>
    <script src="average.js"></script>
    <script src="script.js"></script>
    <script src="radar.js?v=2.0"></script>
    <script src="g_strength.js"></script>
</body>
</html>
